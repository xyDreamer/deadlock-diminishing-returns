<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11141A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stacking">
<title>Deadlock Stacking</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311141A'/%3E%3Cpath d='M12 48 L24 30 L36 22 L52 16' stroke='%235CC2AE' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M12 48 L52 10' stroke='%23D2AE63' stroke-width='3' stroke-dasharray='5 4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — stat list in a slide-out drawer on every screen (closes on pick), sticky readout; body top to bottom: buff | debuff columns, full-width chart, plain formula + step-by-step calc, notes */
:root{
  --bg:#F2F0EA; --surface:#FBFAF6; --raised:#FFFFFF; --line:#DDD8CB; --fg:#1B2230; --muted:#5E6470;
  --brass:#8A6620; --brass-bg:#F0E5CA; --patina:#1D7B6A; --patina-bg:#DAEEE8; --ash:#9A9C9E; --scrim:rgba(17,20,26,.45);
  --weapon:#B0601A; --weapon-bg:#F7E6D2; --spirit:#7D45BC; --spirit-bg:#EEE4F8; --vitality:#4A8526; --vitality-bg:#E3EFD8; --soul-filter:drop-shadow(0 0 .35px rgba(14,90,102,.75));
  --display:"Forum","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141A; --surface:#181D25; --raised:#1E242E; --line:#2A313C; --fg:#E9E3D5; --muted:#99A0A8;
  --brass:#D2AE63; --brass-bg:#3A311F; --patina:#5CC2AE; --patina-bg:#173731; --ash:#6E7378; --scrim:rgba(0,0,0,.55); color-scheme:dark;
  --weapon:#E9A257; --weapon-bg:#3A2918; --spirit:#BB8DEB; --spirit-bg:#2D2340; --vitality:#88C660; --vitality-bg:#21321A; --soul-filter:none}}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#181D25; --raised:#1E242E; --line:#2A313C; --fg:#E9E3D5; --muted:#99A0A8;
  --brass:#D2AE63; --brass-bg:#3A311F; --patina:#5CC2AE; --patina-bg:#173731; --ash:#6E7378; --scrim:rgba(0,0,0,.55); color-scheme:dark;
  --weapon:#E9A257; --weapon-bg:#3A2918; --spirit:#BB8DEB; --spirit-bg:#2D2340; --vitality:#88C660; --vitality-bg:#21321A; --soul-filter:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.nav{position:fixed;inset:0 auto 0 0;width:min(300px,84vw);background:var(--surface);border-right:1px solid var(--line);z-index:30;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.app.drawer .nav{transform:none}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .22s}
.app.drawer .scrim{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;color:var(--fg);padding:9px 10px;border-radius:8px;font-size:14.5px}
.nav a:hover{background:var(--bg)}
.nav a[aria-current="page"]{background:var(--patina-bg);color:var(--patina);font-weight:500}
.nav a .mini{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav a[aria-current="page"] .mini{color:var(--patina)}

.screen{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100%;min-width:0;min-height:0;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.iconbtn{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--fg)}
.iconbtn:hover{background:var(--bg)}
.bar .t{min-width:0;display:flex;flex-direction:column}
.bar .t small{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.bar .t b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.readout{display:flex;align-items:flex-end;gap:16px 22px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.hero{display:flex;flex-direction:column}
.hero .k{font-size:12px;color:var(--muted)}
.hero .v{font-family:var(--display);font-size:54px;line-height:.95;color:var(--patina);font-variant-numeric:tabular-nums lining-nums}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;min-width:0;flex:1}
.fact{display:flex;flex-direction:column;min-width:0}
.fact .k{font-size:11.5px;color:var(--muted)}
.fact .v{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.fact .v s{color:var(--ash);text-decoration-thickness:1px}

.body{overflow-y:auto;overscroll-behavior:contain;min-height:0;-webkit-overflow-scrolling:touch}
.cols{display:flex;flex-direction:column;gap:18px;max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.pane{display:flex;flex-direction:column;gap:16px;min-width:0}
/* items row (buff | shred), divider, then all abilities in one column under it */
.sides{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"a1" "b1" "dv" "ab";gap:18px 20px;align-items:start}
.col-a1{grid-area:a1}.col-b1{grid-area:b1}
.ab-wrap{grid-area:ab;display:flex;flex-direction:column;gap:18px;min-width:0}
.ab-div{grid-area:dv;display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ab-div::before,.ab-div::after{content:"";flex:1;height:1px;background:var(--line)}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (min-width:700px){
  .sides.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a1 b1" "dv dv" "ab ab"}
  /* thin centred column, as wide as one item column: abilities, and the items of stats without shred */
  .sides .ab-wrap:not(.two),.sides:not(.two) .col-a1{justify-self:center;width:calc((100% - 20px) / 2)}
  /* abilities for both buff and shred: two columns under the item columns */
  .ab-wrap.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 20px;align-items:start}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.card .sub{margin:0;font-size:13px;color:var(--muted)}
.rule{font-size:14.5px;background:var(--brass-bg);color:var(--fg);padding:10px 12px;border-radius:8px;margin:0}
.formula{font-family:var(--mono);font-size:15px;line-height:1.6;background:var(--brass-bg);color:var(--fg);padding:12px 14px;border-radius:8px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.where{margin:0;font-size:13px;color:var(--muted)}
.rule-text{margin:0;font-size:14.5px}
.calc{display:flex;flex-direction:column;gap:10px}
.calc h3{margin:0;font-size:11px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400}
.calc .gt{margin:0 0 2px;font-size:13px;color:var(--muted)}
.calc ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.calc p.ln{margin:0}
.calc ol,.calc p.ln{font-size:14px}
.num{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.about{margin:0;color:var(--muted);font-size:14px}
.param{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.param input{width:110px;font-family:var(--mono);font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--fg);text-align:right}
.side-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.side-h h3{flex:1;min-width:0;margin:0;font-size:11px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400}
.link{border:0;background:none;padding:0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* item column: one block per shop category, tinted in the game's category colors */
.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:flex;flex-direction:column;border:1px solid var(--line);border-left:4px solid var(--k);border-radius:12px;overflow:hidden;background:var(--raised)}
.cat-h{display:flex;align-items:center;gap:10px;padding:5px 12px;background:var(--kb);color:var(--k);font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.cat-h .cat-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* column captions line up with .vl and .ct in the rows below (same widths, gap and right padding) */
.cat-h .cap-vl,.cat-h .cap-ct{letter-spacing:.06em;text-transform:none;opacity:.85;text-align:right}
.cat-h .cap-vl{width:60px}
.cat-h .cap-ct{width:64px}
.k-w{--k:var(--weapon);--kb:var(--weapon-bg)}
.k-s{--k:var(--spirit);--kb:var(--spirit-bg)}
.k-v{--k:var(--vitality);--kb:var(--vitality-bg)}
.k-x{--k:var(--ash);--kb:var(--bg)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto auto;align-items:center;gap:10px;padding:8px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;min-height:46px}
.row:first-child{border-top:0}
.row:hover{background:var(--bg)}
/* item icon doubles as the pick box: picked → icon fades, pick order on top */
.ico{position:relative;width:40px;height:40px;border-radius:9px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted)}
.ico img{width:100%;height:100%;display:block;transition:opacity .15s}
.row.on .ico img{opacity:.3}
/* component already consumed by a picked upgrade in this column */
.row.blocked{cursor:not-allowed}
.row.blocked:hover{background:none}
.row.blocked .ico img{filter:grayscale(1);opacity:.35}
.row.blocked .nm b,.row.blocked .vl,.row.blocked .ct{opacity:.45}
.row.blocked .gain{color:var(--muted)}
.row.on .ico{box-shadow:inset 0 0 0 2px var(--patina)}
.row.b.on .ico{box-shadow:inset 0 0 0 2px var(--brass)}
.ico .ord{position:absolute;inset:0;z-index:2;display:grid;place-items:center;font:600 20px var(--mono);color:var(--fg);text-shadow:0 0 4px var(--surface),0 0 8px var(--surface)}
/* lightning badge on icons of items with an active effect */
.act-badge{position:absolute;right:2px;bottom:2px;z-index:1;width:15px;height:15px;border-radius:50%;background:#10130D;box-shadow:0 0 0 1.5px #FFEFD7;display:grid;place-items:center}
.act-badge svg{width:10px;height:10px;fill:#FFD35C}
/* base column tags: which effect the number belongs to */
.fx{display:block;font-family:var(--body);font-size:10.5px;line-height:1.3;color:var(--muted);text-align:right}
.fx-a{display:inline-block;margin-top:2px;padding:0 5px;border-radius:4px;background:var(--k,var(--fg));color:var(--raised);font-weight:600}
/* tick that adds an item's active effect to the calculation */
.actbox{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--raised);font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.actbox input{margin:0;accent-color:var(--k,var(--patina));cursor:pointer}
.actbox:has(input:checked){border-color:var(--k,var(--patina));color:var(--fg);font-weight:600}
.ico .ord:empty{display:none}
.row .nm{display:flex;flex-direction:column;min-width:0}
.row .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm b{font-weight:400}
.row .gain{font-family:var(--mono);font-size:11.5px;color:var(--patina);font-variant-numeric:tabular-nums}
.row.b .gain{color:var(--brass)}
.row .vl{display:flex;flex-direction:column;align-items:flex-end;min-width:60px;line-height:1.25;text-align:right;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.on .vl{color:var(--patina)}
.row.b.on .vl{color:var(--brass)}
/* price reads as a label, not a field: the game's soul glyph + bold number, no box */
.row .ct{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;min-width:64px;font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .ct::before{content:"";flex:none;width:10px;height:18px;background:var(--soul-img) center/contain no-repeat;filter:var(--soul-filter)}
.stk{display:flex;align-items:center;gap:5px;cursor:default}
.stk .arr{display:flex;flex-direction:column}
.stk .arr button{width:22px;height:15px;padding:0;border:1px solid var(--line);background:var(--raised);color:var(--fg);font-size:8px;line-height:1;cursor:pointer;display:grid;place-items:center}
.stk .arr button:first-child{border-radius:5px 5px 0 0}
.stk .arr button:last-child{border-radius:0 0 5px 5px;border-top:0}
.stk .arr button:hover:not(:disabled){background:var(--bg);border-color:var(--ash)}
.stk .arr button:disabled{opacity:.35;cursor:default}
.stk .cnt{font-family:var(--mono);font-size:13px;font-weight:500;min-width:30px;font-variant-numeric:tabular-nums}
.stk .cnt small{font-size:11px;font-weight:400;color:var(--muted)}
/* phone: stack counter drops under the item name so the name keeps its width */
@media (max-width:480px){
  .row{grid-template-columns:40px minmax(0,1fr) auto auto;row-gap:4px}
  .row .nostk{display:none}
  .row.has-stk .ico{grid-row:1 / 3}
  .row.has-stk .nm{grid-column:2;grid-row:1}
  .row.has-stk .stk{grid-column:2;grid-row:2}
  .row.has-stk .vl{grid-column:3;grid-row:1 / 3}
  .row.has-stk .ct{grid-column:4;grid-row:1 / 3}
}
.sorts{display:flex;gap:4px}
.sorts button{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.sorts button:hover{border-color:var(--ash);color:var(--fg)}
.sorts button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
/* picked list above the chart: one neutral block as wide as the chart, column totals in the header */
.sum{display:flex;flex-direction:column;border:1px solid var(--line);border-left:4px solid var(--ash);border-radius:12px;overflow:hidden;background:var(--raised)}
.sum-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;padding:6px 12px;background:var(--bg)}
.sum-t{flex:1 0 auto;white-space:nowrap;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sum-v{display:inline-flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:20px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum-v i{font-family:var(--body);font-style:normal;font-size:12px;font-weight:500;color:var(--patina)}
.sum-v.b i{color:var(--brass)}
.sum-r{display:grid;grid-template-columns:14px 18px 26px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:5px 12px;border-top:1px solid var(--line);font-size:14px;background:var(--raised)}
.sum-r .grip{cursor:grab;touch-action:none;user-select:none;color:var(--ash);font-size:13px;letter-spacing:-2px;line-height:1;text-align:center}
.sum-r .grip:hover{color:var(--fg)}
.sum-r.dragging{position:relative;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.18);border-top-color:transparent;opacity:.95}
.sum-r.dragging .grip{cursor:grabbing}
body.dragging-sum{cursor:grabbing;user-select:none}
.side-tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--patina-bg);color:var(--patina);white-space:nowrap}
.side-tag.b{background:var(--brass-bg);color:var(--brass)}
.sum-r .n{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.sum-r .si{width:26px;height:26px;border-radius:6px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
.sum-r .si img{width:100%;height:100%;display:block}
.sum-r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-r .nm small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sum-r .v{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum-r.empty{display:block;color:var(--muted);font-size:13px}
.sum-r .si.ab{background:#1b2028}
.sum-r .si.ab img{padding:3px;box-sizing:border-box}

/* hero abilities block under the item categories */
.cat.k-ab{--k:var(--ash);--kb:var(--bg)}
.ab-search{padding:8px 12px;border-top:1px solid var(--line)}
.ab-search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--fg);font:inherit;font-size:14px}
.hero-g[hidden]{display:none}
.hero-h{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600}
.hero-h img,.hero-h .hero-x{flex:none;width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--line)}
.hero-x{display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--muted)}
.ico.ab{background:#1b2028;overflow:visible}
.ico.ab > img{padding:6px;box-sizing:border-box;border-radius:9px}
.ico .hero-mini{position:absolute;right:-3px;bottom:-3px;z-index:1;width:20px;height:20px;border-radius:50%;overflow:hidden;background:#2a313c;box-shadow:0 0 0 1.5px var(--raised)}
.ico .hero-mini img,.ico .hero-mini .hero-x{width:100%;height:100%;display:block;object-fit:cover}
.row.on .ico.ab > img{opacity:.3}
.ab-sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* upgrade level: three pips (bought upgrades) and the point cost 0 / 1 / 2 / 5 */
.lvl{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;min-width:64px;font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--fg)}
.pips{display:inline-flex;gap:2px}
.pips i{width:5px;height:13px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--brass)}
.row,.sum-r{-webkit-touch-callout:none} /* long press opens the item card instead of the system menu */

/* item card: dark like the in-game tooltip in both themes, tinted by shop category */
#card{position:fixed;z-index:50;left:0;top:0;width:min(330px,calc(100vw - 24px));pointer-events:none;opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .12s,transform .12s,visibility .12s}
#card.show{opacity:1;visibility:visible;transform:none}
.card-in{--ch:#5b3a17;--cb:#241b12;--ca:#E9A257;background:var(--cb);color:#EDE6D6;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.35);font-size:13.5px;line-height:1.45}
.card-in.c-s{--ch:#4a2a49;--cb:#211821;--ca:#C79AF0}
.card-in.c-v{--ch:#33461c;--cb:#182013;--ca:#93CF6A}
.cd-head{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--ch)}
.cd-ico{flex:none;width:48px;height:48px;border-radius:8px;overflow:hidden;display:grid;place-items:center;background:rgba(0,0,0,.25)}
.cd-ico img{width:100%;height:100%;display:block}
.cd-name{display:block;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;color:#FFF3DE}
.cd-meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;font-family:var(--mono);font-size:12px;color:rgba(255,243,222,.72)}
.cd-cost{display:inline-flex;align-items:center;gap:4px;color:#99FFD6;font-weight:600}
.cd-cost::before{content:"";width:8px;height:14px;background:var(--soul-img) center/contain no-repeat}
.cd-innate{list-style:none;margin:0;padding:10px 14px 2px;display:flex;flex-direction:column;gap:1px;color:#D8D2C4}
.cd-sec{margin:8px 10px;border-radius:8px;background:rgba(0,0,0,.28);overflow:hidden}
.cd-sh{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:rgba(0,0,0,.3);color:#FFF3DE;font-size:12.5px;font-weight:600;font-style:italic}
.cd-sh .cd-cd{font-family:var(--mono);font-style:normal;font-weight:500}
.cd-desc{margin:0;padding:8px 10px 2px;color:#CDCDCD;font-size:13px}
.cd-desc b{color:#FFFFFF;font-weight:600}
.cd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;padding:8px 10px}
.cd-stat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;padding:6px 6px;border-radius:6px;background:rgba(255,255,255,.06)}
.cd-stat b{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--ca);white-space:nowrap}
.cd-stat span{font-size:11.5px;line-height:1.25;color:#BDB6A8}
.cd-notes{display:flex;flex-wrap:wrap;gap:2px 12px;padding:0 10px 8px;font-size:12px;color:#BDB6A8}
.cd-tree{margin:0;padding:4px 14px 10px;font-size:12px;color:#BDB6A8}
.cd-tree + .cd-tree{padding-top:0}
/* ability card: neutral dark like the game's ability tooltip, upgrade costs in ability-point purple */
.card-in.c-ab{--ch:#2b2f37;--cb:#16191e;--ca:#E8CF95}
.cd-ico.ab{background:#0f1216}
.cd-ico.ab img{padding:6px;box-sizing:border-box}
.ab-hero-tag{display:inline-flex;align-items:center;gap:5px}
.ab-hero-tag img,.ab-hero-tag .hero-x{width:18px;height:18px;border-radius:50%;object-fit:cover;background:#2a313c}
.ab-head{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 14px 0;font-family:var(--mono);font-size:12.5px;color:#EDE6D6}
.ab-head i{font-family:var(--body);font-style:normal;color:#BDB6A8}
.cd-desc i{color:#BDB6A8}
.cd-stat .ab-when{font-style:normal;font-size:10.5px;color:#BDB6A8}
.cd-stat .ab-eff{font-style:normal;font-size:11px;font-weight:600;color:#FFEFD7}
.ab-scale{display:inline-flex;align-items:center;gap:3px;margin:1px 0 2px;padding:1px 6px 1px 4px;border-radius:4px;background:rgba(0,0,0,.35);font-family:var(--mono);font-size:11.5px;font-weight:600;color:#D7B4FF}
.ab-scale img{height:14px;width:auto;display:block}
.ab-scale.sk-weapon{color:#F0B067}
.ab-scale.sk-melee{color:#FF9B8A}
.ab-scale.sk-boon{color:#9FE3F2}
.ab-ups{display:flex;flex-direction:column;gap:4px;margin:8px 10px 10px}
.ab-up{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:5px 8px;border-radius:6px;background:rgba(255,255,255,.05);font-size:12.5px;color:#D8D2C4}
.ab-up > b{display:grid;place-items:center;height:20px;border-radius:4px;background:rgba(188,142,232,.18);color:#BC8EE8;font-family:var(--mono);font-size:12px}
.ab-up b b,.ab-up span b{color:#FFFFFF}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;display:inline-block;border-radius:2px}
.sw.sq{width:10px;height:10px}
.chart{position:relative;width:100%;height:300px}
.chart canvas{position:absolute;inset:0;width:100%;height:100%}
.notes{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.empty{color:var(--muted);font-size:13.5px;margin:0}
.ccgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.ccgrid .card b{font-weight:500}
.ccgrid .card p{margin:0;color:var(--muted);font-size:14px}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--brass)}
.body{padding-bottom:env(safe-area-inset-bottom,0px)}

@media (min-width:980px){
  .cols{padding:20px 24px 32px}
  .chart{height:360px}
  .hero .v{font-size:62px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

  extra:(r,p)=>[['Новый кулдаун',(p*(1-r.m)).toFixed(1)+' с']],
  notes:['Compress Cooldown улучшается в Superior Cooldown — компонент и апгрейд не складываются.','Item Cooldown Reduction — отдельный стат, его даёт только Transcendent Cooldown (+25%).']}
];

const $ = s=>document.querySelector(s);
const nf1 = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1});
const pct = x=>nf1.format(Math.round(x*1000)/10).replace('-','−')+'%';
const pp = x=>nf1.format(Math.round(x*1000)/10).replace('-','−');
const souls = n=>n.toLocaleString('ru-RU');
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

// variants like "Vampiric Burst (active)" share the base item's icon, category and upgrade path; same suffixes as tools/build_icons.py
const baseName = name=>name.replace(/ \((active|on hit|max)\)$/,'');

// upgrade → the items it is built from (Deadlock Wiki item pages, 27.10.2026), only pairs where both are in CATS.
// Buying an upgrade consumes its component, so within one column they can't be picked together.
const COMPONENTS = {
  'Crippling Headshot':['Weakening Headshot'], 'Arctic Blast':['Cold Front'], 'Burst Fire':['Rapid Rounds'], 'Swift Striker':['Rapid Rounds'],
  'Crushing Fists':['Melee Charge'], 'Disarming Hex':['Rusted Barrel'], 'Focus Lens':['Spirit Sap'],
  'Fury Trance':['Bullet Lifesteal'], 'Vampiric Burst':['Bullet Lifesteal'], 'Leech':['Bullet Lifesteal','Spirit Lifesteal'],
  'Infuser':['Spirit Lifesteal'], 'Spiritual Overflow':['Spirit Lifesteal'], 'Juggernaut':['Enduring Speed'],
  'Lightning Scroll':['Mystic Slow'], 'Mercurial Magnum':['Quicksilver Reload'], 'Point Blank':['Close Quarters'],
  'Superior Cooldown':['Compress Cooldown'], 'Transcendent Cooldown':['Superior Cooldown'], 'Vortex Web':['Slowing Hex'],
  'Weighted Shots':['Slowing Bullets'], 'Spirit Rend':['Spirit Shredder'], 'Escalating Exposure':['Mystic Vulnerability'], 'Spirit Snatch':['Spirit Strike']
};
// every item an upgrade is built from, down the whole chain (Transcendent → Superior → Compress Cooldown)
function ancestors(name){
  const out=new Set();
  (function walk(n){(COMPONENTS[n]||[]).forEach(p=>{if(!out.has(p)){out.add(p); walk(p);}});})(baseName(name));
  return out;
}
const itemName = (c,s)=>c[s[0]].items[s[1]][0];
// the picked item in the same column that already consumed item i, or null
function blockedBy(c,key,i,sel){
  const nm=baseName(c[key].items[i][0]);
  const hit=sel.find(s=>s[0]===key && ancestors(itemName(c,s)).has(nm));
  return hit?itemName(c,hit):null;
}
// a player is one hero: caster-only buffs (who:'self') of another hero in the same column block this one
function selfHero(c,s){const it=c[s[0]].items[s[1]], a=it[3]&&it[3].ab; return a&&a.who==='self'?a.hero:null;}
function heroBlockedBy(c,key,i,sel){
  const h=selfHero(c,[key,i]); if(!h) return null;
  const hit=sel.find(s=>s[0]===key && selfHero(c,s) && selfHero(c,s)!==h);
  return hit?selfHero(c,hit):null;
}
// one hero ability at different upgrade levels is one pick: same column, hero, ability and effect
function abKey(c,s){const it=c[s[0]].items[s[1]], a=it[3]&&it[3].ab; return a?[s[0],a.hero,it[0],a.note].join('|'):null;}
// build after picking item i: its components in the same column drop out, and so does another level of the same ability
function withPick(c,sel,key,i){
  const anc=ancestors(c[key].items[i][0]), ak=abKey(c,[key,i]);
  return [...sel.filter(s=>!(s[0]===key && anc.has(baseName(itemName(c,s)))) && !(ak&&abKey(c,s)===ak)), [key,i]];
}
// old saves: drop components whose upgrade is picked, keep only the last picked level of an ability and the last hero's self-buffs
const prune = (c,sel)=>sel.filter((s,n)=>!blockedBy(c,s[0],s[1],sel) && !heroBlockedBy(c,s[0],s[1],sel.slice(n+1)) && !(abKey(c,s)&&sel.slice(n+1).some(x=>abKey(c,x)===abKey(c,s))));

// hero abilities join their stat's column as items: [ability, value, 0 souls, {ab:{hero, slot, lvl, self, note}}]
ABILITIES.forEach(r=>{const c=CATS.find(x=>x.id===r.tab); if(c&&c[r.side]) c[r.side].items.push([r.name, r.v, 0, {ab:r}]);});

const state = {};
CATS.forEach(c=>{
  if(c.mode==='info')return;
  const saved = store('dl-build-'+c.id);
  const sel = Array.isArray(saved) ? prune(c, saved.filter(x=>Array.isArray(x)&&c[x[0]]&&c[x[0]].items[x[1]])) : [];
  const p = store('dl-param-'+c.id);
  const k = store('dl-stk-'+c.id);
  const a = store('dl-act-'+c.id);
  state[c.id] = {sel, param: typeof p==='number'?p:c.param.val, stk: k&&typeof k==='object'?k:{}, act: a&&typeof a==='object'?a:{}};
});

// optional 4th item field:
//   {per, min, max, how} — stacks: base value it[1] plus per × stacks (Spirit Rend: 1 − (1 − 8%) × (1 − 7% × n))
//   {fx:'a'}             — the value comes only from the item's active effect
//   {act:N}              — passive it[1] plus an active effect of N% that counts only while ticked
// base, stacks and the active part are separate sources
const extra = it=>it[3]||{};
function stacks(c,key,i){const st=extra(c[key].items[i]); if(!st.per) return 0; const n=state[c.id].stk[key+i]; return typeof n==='number'?Math.min(st.max,Math.max(st.min,n)):st.min;}
const activeOn = (c,key,i)=>!!state[c.id].act[key+i];
// the parts of an item's value as [label, fraction], also used by the step-by-step calc
function parts(c,key,i){
  const it=c[key].items[i], ex=extra(it), out=[];
  if(it[1]) out.push([ex.ab?`${it[0]} (${ex.ab.hero}, ур. ${ex.ab.lvl})`:it[0], it[1]/100]);
  if(ex.per){const n=stacks(c,key,i); if(n) out.push([`${it[0]} (стаки: ${n} × ${ex.per}%)`, n*ex.per/100]);}
  if(ex.act&&activeOn(c,key,i)) out.push([`${it[0]} (активный)`, ex.act/100]);
  return out;
}
const sources = (c,key,i)=>parts(c,key,i).map(p=>p[1]);
// item's own value at its current stacks, combined the way its column stacks
function additive(c,key){return c.mode==='dmgred' || c.mode==='fire'&&key==='a' || c.mode==='slow'&&key==='b';}
function itemVal(c,key,i){const s=sources(c,key,i); return additive(c,key)?s.reduce((t,v)=>t+v,0):1-s.reduce((k,v)=>k*(1-v),1);}
// column shown with a minus sign (debuffs, shred, enemy slows)
function isMinus(c,key){return (c.mode==='resist'||c.mode==='fire')&&key==='b' || c.mode==='dmgred' || c.mode==='mult'&&c.id==='antiheal';}
// total of one column's picked items, stacked the way that column stacks
function sideTotal(c,key){
  const src=state[c.id].sel.filter(s=>s[0]===key).flatMap(s=>sources(c,key,s[1]));
  if(!additive(c,key)) return 1-src.reduce((k,v)=>k*(1-v),1);
  const sum=src.reduce((t,v)=>t+v,0);
  return c.mode==='fire'&&key==='a'?sum:Math.min(sum,1); // fire rate bonuses have no cap
}
// short names of the two columns, used as tags in the picked list above the chart
const SIDE_TAG={resist:{a:'резист',b:'шред'}, slow:{a:'замедление',b:'сопротивление'}, fire:{a:'бонус',b:'замедление'}, dmgred:{a:'общее',b:'spirit'}};
// picked items above the chart: one list in pick order (drag the grip to reorder), each column's total in the header
function sumsHTML(c){
  const sel=state[c.id].sel, tag=k=>(SIDE_TAG[c.mode]||{})[k]||'';
  const total=k=>{
    if(!c[k]) return '';
    const sg=isMinus(c,k)?'−':'+', has=sel.some(x=>x[0]===k);
    return `<span class="sum-v ${k}">${c.b?`<i>${tag(k)}</i>`:''}${has?sg+pp(sideTotal(c,k))+PC:'—'}</span>`;
  };
  const rows=sel.map(([k,i],n)=>{const it=c[k].items[i], ex=extra(it), sg=isMinus(c,k)?'−':'+';
    const tags=[ex.ab?`${ex.ab.hero}, ур. ${ex.ab.lvl}`:'', ex.per?`${stacks(c,k,i)}/${ex.max} ст.`:'', ex.fx==='a'?'активный':'', ex.act&&activeOn(c,k,i)?'+ активный':''].filter(Boolean).join(' · ');
    return `<div class="sum-r ${k}" data-pos="${n}" data-card="${esc((ex.ab?'ab:':'')+it[0])}">
      <span class="grip" title="Перетащите, чтобы поменять порядок" aria-label="Перетащить">⋮⋮</span><span class="n">${n+1}</span>
      <span class="si ${ex.ab?'ab':''}">${itemIcon(it)}</span><span class="nm">${esc(it[0])}${tags?` <small>${esc(tags)}</small>`:''}</span>
      ${c.b?`<span class="side-tag ${k}">${tag(k)}</span>`:''}<span class="v">${sg}${pp(itemVal(c,k,i))}${PC}</span></div>`;}).join('');
  return `<div class="sum"><div class="sum-h"><span class="sum-t">Выбрано · ${sel.length}</span>${total('a')}${total('b')}</div>
    <div class="sum-list">${rows||'<div class="sum-r empty">Ничего не выбрано</div>'}</div></div>`;
}

// plain-language rule per mode, shown above the step-by-step calculation
const RULES = {
  mult:'Каждый следующий предмет добавляет свой процент не от 100%, а только от того, что осталось после предыдущих. Пример: 20% и 5%. Первый даёт 20%, остаётся 80%. Второй даёт 5% от этих 80%, то есть 4%. Итого 24%, а не 25%.',
  resist:'Resist цели считается по шагам: каждый следующий предмет добавляет свой процент только от того, что осталось после предыдущих. Shred атакующих считается отдельно по тому же правилу. В конце из Resist вычитается shred — это и есть итог.',
  slow:'Замедления считаются по шагам: каждое следующее добавляет свой процент только от того, что осталось после предыдущих. Slow Resist цели просто складываются и срезают замедление на свою сумму. Замедляется только скорость выше 2 м/с — медленнее 2 м/с цель не станет.',
  fire:'Бонусы Fire Rate просто складываются. Вражеские Fire Rate Slow считаются по шагам: каждый следующий берёт свой процент только от того, что осталось после предыдущих. Итог — бонусы минус замедление, но не ниже −50%. Минус работает мягче, чем выглядит: при −50% стрельба медленнее в 1,5 раза, а не в 2.',
  dmgred:'Здесь всё просто складывается, убывания нет. Spirit Damage Reduction (Silencer) срабатывает после общего Damage Reduction — от того урона, что после него остался.'
};

// formula per mode: lines with letters, plus what the letters mean for this stat
const FORMULAS = {
  mult:{lines:['Итог = 100% − (100% − A) × (100% − B) × (100% − C) × …'],
    where:c=>`A, B, C … — ${c.a.h} предметов в порядке покупки`},
  resist:{lines:['Resist = 100% − (100% − A) × (100% − B) × …','Shred = 100% − (100% − X) × (100% − Y) × …','Итог = Resist − Shred'],
    where:c=>`A, B … — ${c.a.h}; X, Y … — ${c.b.h}`},
  slow:{lines:['Slow = 100% − (100% − A) × (100% − B) × …','Resist = X + Y + …  (не больше 100%)','Итог = Slow × (100% − Resist)','Скорость = (V − 2) × (100% − Итог) + 2'],
    where:c=>`A, B … — ${c.a.h}; X, Y … — ${c.b.h}; V — Move Speed цели, м/с`},
  fire:{lines:['Бонус = A + B + C + …','Slow = 100% − (100% − X) × (100% − Y) × …','Итог = Бонус − Slow  (не ниже −50%)','Пуль/с = V × (1 + Итог), если Итог ≥ 0','Пуль/с = V ÷ (1 − Итог), если Итог < 0'],
    where:c=>`A, B, C … — ${c.a.h}; X, Y … — ${c.b.h}; V — базовый Fire Rate, пуль/с`},
  dmgred:{lines:['Weapon-урон = 100% − (A + B + …)','Spirit-урон = Weapon-урон × (100% − (X + …))'],
    where:c=>`A, B … — ${c.a.h}; X … — ${c.b.h}`}
};

function compute(c, sel){
  const A = sel.filter(s=>s[0]==='a').flatMap(s=>sources(c,'a',s[1]));
  const B = sel.filter(s=>s[0]==='b').flatMap(s=>sources(c,'b',s[1]));
  const prod = arr=>arr.reduce((k,v)=>k*(1-v),1);
  const sum = arr=>arr.reduce((t,v)=>t+v,0);
  switch(c.mode){
    case 'mult': return {m:1-prod(A), naive:Math.min(sum(A),1)};
    case 'resist': {const R=1-prod(A), S=1-prod(B); return {m:R-S, naive:sum(A)-sum(B), R, S};}
    case 'slow': {const S=1-prod(A), res=Math.min(sum(B),1); return {m:S*(1-res), naive:Math.min(sum(A),1)*(1-res)};}
    case 'fire': {const mod=Math.max(sum(A)-(1-prod(B)),-0.5); return {m:mod, naive:sum(A)-sum(B), f: mod>=0?1+mod:1/(1-mod)};}
    case 'dmgred': {const w=Math.max(0,1-sum(A)), s=w*Math.max(0,1-sum(B)); return {m:1-s, naive:sum(A)+sum(B), w, s};}
  }
}
const signed = (c,x)=>(c.mode==='fire'&&x>0?'+':'')+pct(x);
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function current(){const id=(location.hash||'').slice(1); return CATS.find(x=>x.id===id)||CATS[0];}

function renderNav(){
  const c = current(); let html='', g='';
  CATS.forEach(x=>{
    if(x.grp!==g){g=x.grp; html+=`<div class="grp">${g}</div>`;}
    const mini = x.mode==='info'?'':signed(x, compute(x,state[x.id].sel).m);
    html+=`<a href="#${x.id}" data-id="${x.id}" ${x===c?'aria-current="page"':''}><span>${x.tab}</span><span class="mini">${mini}</span></a>`;
  });
  $('#navlist').innerHTML = html;
}

function render(){
  hideCard(); // rows are about to be replaced
  const c = current();
  renderNav();
  $('#barGroup').textContent = c.grp;
  $('#barTitle').textContent = c.tab;
  document.title = c.tab+' · Deadlock Stacking';
  if(c.mode==='info'){
    $('#readout').innerHTML = `<div class="hero"><span class="k">Длительность повторного CC</span><span class="v">−15…35%</span></div>`;
    $('#cols').innerHTML = ccHTML();
    return;
  }
  renderReadout(c);
  const st = state[c.id];
  $('#cols').innerHTML = `
   <div class="sides ${c.b?'two':''}">${sideHTML(c,'a')}${sideHTML(c,'b')}${(()=>{
     const abA=sideHTML(c,'a','ab'), abB=sideHTML(c,'b','ab'); // two columns only when both buff and shred have abilities
     return abA||abB?`<div class="ab-div" role="separator"><span>Способности героев</span></div><div class="ab-wrap ${abA&&abB?'two':''}">${abA}${abB}</div>`:'';})()}</div>
   <div class="card">
     <h2>Как растёт итог</h2>
     ${sumsHTML(c)}
     <div class="legend"><span><i class="sw" style="background:var(--patina)"></i>Реально</span><span><i class="sw" style="background:repeating-linear-gradient(90deg,var(--ash) 0 5px,transparent 5px 8px);opacity:.3"></i>Если бы складывалось</span><span><i class="sw sq" style="background:var(--brass)"></i>Вклад предмета, %</span></div>
     <div class="chart" id="chartWrap"><canvas id="c1" role="img" aria-label="${c.metric}: рост по мере добавления предметов"></canvas></div>
     <p class="sub">Номера по оси совпадают с порядком покупки в сборке.</p>
   </div>
   <div class="card">
     <h2>Как считается</h2>
     <div class="formula">${FORMULAS[c.mode].lines.map(l=>`<div>${l}</div>`).join('')}</div>
     <p class="where">где ${FORMULAS[c.mode].where(c)}</p>
     <p class="rule-text">${RULES[c.mode]}</p>
     <p class="about">${c.about}</p>
     <div class="calc" id="calc"></div>
     <label class="param" for="param-${c.id}"><span>${c.param.label}</span><input id="param-${c.id}" type="number" inputmode="decimal" min="0" step="${c.param.step||1}" value="${st.param}"></label>
   </div>
   ${c.notes.length?`<ul class="notes">${c.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`:''}`;

  document.querySelectorAll('.row').forEach(b=>{
    b.onclick=()=>toggle(c,b.dataset.side,+b.dataset.i);
    b.onkeydown=e=>{if(e.target===b&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); toggle(c,b.dataset.side,+b.dataset.i);}};});
  document.querySelectorAll('.stk').forEach(s=>s.onclick=e=>e.stopPropagation()); // counter area doesn't toggle the row
  document.querySelectorAll('[data-act]').forEach(b=>b.onchange=()=>{const r=b.closest('.row'); setActive(c,r.dataset.side,+r.dataset.i,b.checked);});
  // ability search filters hero groups in place, so the input keeps focus while typing
  document.querySelectorAll('[data-absearch]').forEach(inp=>inp.oninput=()=>{
    const q=abQuery[inp.dataset.absearch]=inp.value.trim().toLowerCase(), box=inp.closest('.k-ab');
    let any=false;
    box.querySelectorAll('.hero-g').forEach(g=>{const hit=!q||g.dataset.find.includes(q); g.hidden=!hit; any=any||hit;});
    box.querySelector('.ab-none').hidden=any;
  });
  document.querySelectorAll('[data-stk]').forEach(b=>b.onclick=e=>{e.stopPropagation(); const r=b.closest('.row'); stepStack(c,r.dataset.side,+r.dataset.i,+b.dataset.stk);});
  document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{st.sel=st.sel.filter(s=>s[0]!==b.dataset.clear); save(c); render();});
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{cycleSort(c,b.dataset.side,b.dataset.sort); const y=$('#body').scrollTop; render(); $('#body').scrollTop=y;});
  const inp=$('#param-'+c.id);
  inp.oninput=()=>{const v=parseFloat(inp.value); if(!isNaN(v)&&v>=0){st.param=v; store('dl-param-'+c.id,v); renderReadout(c); renderCalc(c);}};
  renderCalc(c); drawChart(c);
}

function save(c){store('dl-build-'+c.id, state[c.id].sel);}
function toggle(c,k,i){
  if(longPressed){longPressed=false; return;} // the tap that ended a long press only opened the card
  const st=state[c.id]; const at=st.sel.findIndex(s=>s[0]===k&&s[1]===i);
  if(at>=0) st.sel.splice(at,1);
  else if(blockedBy(c,k,i,st.sel)||heroBlockedBy(c,k,i,st.sel)) return; // consumed by a picked upgrade, or another hero's self-buff is picked
  else st.sel=withPick(c,st.sel,k,i);
  save(c);
  const y = $('#body').scrollTop; render(); $('#body').scrollTop = y;
}

function renderReadout(c){
  const st=state[c.id], r=compute(c,st.sel);
  const cost=st.sel.reduce((t,s)=>t+c[s[0]].items[s[1]][2],0);
  const facts=[...c.extra(r,st.param), ['Простая сумма', c.mode==='dmgred'?signed(c,r.naive):'<s>'+signed(c,r.naive)+'</s>'], ['Souls', souls(cost)]];
  $('#readout').innerHTML = `<div class="hero"><span class="k">${c.metric}</span><span class="v">${signed(c,r.m)}</span></div>
   <div class="facts">${facts.map(f=>`<div class="fact"><span class="k">${f[0]}</span><span class="v">${f[1]}</span></div>`).join('')}</div>`;
}

// part 'items': column header + item categories; part 'ab': the column's abilities block (own grid row, see .sides)
function sideHTML(c,key,part='items'){
  const s=c[key]; if(!s) return '';
  const st=state[c.id]; const pos={}; st.sel.forEach((x,i)=>pos[x[0]+x[1]]=i+1);
  const base=compute(c,st.sel).m;
  const minus = isMinus(c,key);
  // display order only; data-i keeps the original index
  const so=getSort(c,key), order=s.items.map((_,i)=>i);
  if(so){const v=i=>so.k==='cost'?s.items[i][2]:itemVal(c,key,i);
    order.sort((x,y)=>(v(x)-v(y))*so.d || x-y);}
  const sortBtn=(k,label,title)=>`<button type="button" data-sort="${k}" data-side="${key}" title="${title}" aria-pressed="${!!so&&so.k===k}">${label}${so&&so.k===k?(so.d>0?' ↑':' ↓'):''}</button>`;
  if(part==='ab') return abilitiesHTML();
  return `<div class="side col-${key}1"><div class="side-h"><h3>${s.h}</h3>
    <div class="sorts">${sortBtn('val','%','Сортировать по проценту')}${sortBtn('cost','Цена','Сортировать по цене')}</div>
    <button type="button" class="link" data-clear="${key}">Снять все</button></div>
  <div class="cats">${KINDS.map(([kd,label])=>{const rows=order.filter(i=>!extra(s.items[i]).ab&&kindOf(s.items[i][0])===kd);
    return rows.length?`<div class="cat k-${kd}"><div class="cat-h"><span class="cat-t">${label} · ${rows.length}</span><span class="cap-vl" title="Значение предмета само по себе, без учёта других предметов">база</span><span class="cap-ct">цена</span></div>${rows.map(rowHTML).join('')}</div>`:'';}).join('')}</div></div>`;
  // ability rows keep the build order of ABILITIES: hero A→Z, then ability slot, then upgrade level
  function abilitiesHTML(){
    const idx=s.items.map((_,i)=>i).filter(i=>extra(s.items[i]).ab); if(!idx.length) return '';
    const q=abQuery[key], groups=[];

function setActive(c,key,i,on){
  const st=state[c.id]; if(on) st.act[key+i]=true; else delete st.act[key+i];
  store('dl-act-'+c.id, st.act);
  const y=$('#body').scrollTop; render(); $('#body').scrollTop=y;
}
function stepStack(c,key,i,d){
  const sk=c[key].items[i][3], st=state[c.id];
  st.stk[key+i]=Math.min(sk.max,Math.max(sk.min,stacks(c,key,i)+d)); store('dl-stk-'+c.id, st.stk);
  const y=$('#body').scrollTop; render(); $('#body').scrollTop=y;
}

// per-column sort: {k:'val'|'cost', d:1 asc | -1 desc} or null for the default order
const sorts={};
function getSort(c,key){const id=c.id+'-'+key; if(!(id in sorts)) sorts[id]=store('dl-sort-'+id)||null; return sorts[id];}
function cycleSort(c,key,k){
  // first click: price cheapest first, percent biggest first; second click flips; third resets
  const cur=getSort(c,key), first=k==='cost'?1:-1;
  const next=!cur||cur.k!==k ? {k,d:first} : cur.d===first ? {k,d:-first} : null;
  sorts[c.id+'-'+key]=next; store('dl-sort-'+c.id+'-'+key,next);
}

const nf2 = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const N = x=>`<span class="num">${x}</span>`;
// diminishing stack, step by step: each item adds its % of what is left
function chain(list){
  let t=0;
  const lines=list.map(([name,v],i)=>{const left=1-t, add=left*v; t+=add;
    return i===0 ? `${name}: ${N(pct(v))}`
      : `${name}: ${N(pct(t-add))} + ${N(pct(v))} от оставшихся ${N(pct(left))} (это ${N(pct(add))}) = ${N(pct(t))}`;});
  return {lines, t};
}
// plain sum with item names
function plus(list){
  const s=list.reduce((t,x)=>t+x[1],0);
  return {line: list.map(x=>`${x[0]} ${N(pct(x[1]))}`).join(' + ')+(list.length>1?` = ${N(pct(s))}`:''), s};
}

function renderCalc(c){
  const el=$('#calc'); if(!el) return;
  const st=state[c.id], r=compute(c,st.sel), p=st.param;
  if(!st.sel.length){el.innerHTML='<p class="empty">Отметьте предметы — здесь появится расчёт по шагам для вашей сборки.</p>'; return;}
  const pick=k=>st.sel.filter(s=>s[0]===k).flatMap(s=>parts(c,k,s[1]));
  const A=pick('a'), B=pick('b'), out=[];
  switch(c.mode){
    case 'mult': out.push([c.a.h, chain(A).lines]); break;
    case 'resist': {
      const ra=chain(A), rb=chain(B);
      if(A.length) out.push([c.a.h, ra.lines]);
      if(B.length) out.push([c.b.h, rb.lines]);
      out.push(['Итог', [`Resist ${N(pct(r.R))} − shred ${N(pct(r.S))} = ${N(pct(r.m))}`+(r.m<0?' — Resist ушёл в минус, цель получает больше урона':'')]]);
      break;}
    case 'slow': {
      const ra=chain(A);
      if(A.length) out.push([c.a.h, ra.lines]);
      if(B.length){const pb=plus(B), res=Math.min(pb.s,1);
        out.push([c.b.h, [pb.line+(pb.s>1?' — больше 100% не бывает':''), `От замедления остаётся ${N(pct(1-res))}: ${N(pct(ra.t))} → ${N(pct(r.m))}`]]);}
      const v=Math.max(p,2), x=v-2, y=x*(1-r.m);
      out.push(['Скорость цели', [`Замедляется только то, что выше 2 м/с: ${N(nf2.format(v))} − 2 = ${N(nf2.format(x))} м/с`,
        `От этого остаётся ${N(pct(1-r.m))}: ${N(nf2.format(x))} → ${N(nf2.format(y))} м/с`,
        `Возвращаем 2 м/с: ${N(nf2.format(y))} + 2 = ${N(nf2.format(y+2))} м/с`]]);
      break;}
    case 'fire': {
      const pa=plus(A), rb=chain(B), raw=pa.s-rb.t;
      if(A.length) out.push([c.a.h, [pa.line]]);
      if(B.length) out.push([c.b.h, rb.lines]);
      const tot=[`Бонусы ${N(signed(c,pa.s))} − замедление ${N(pct(rb.t))} = ${N(signed(c,raw))}`+(raw<-0.5?' — ниже −50% не бывает, итог −50%':'')];
      tot.push(r.m>=0 ? `${N(nf2.format(p))} пуль/с + ${N(pct(r.m))} = ${N(nf2.format(p*r.f))} пуль/с`
        : `Минус делит скорострельность: ${N(nf2.format(p))} пуль/с делим на ${N(nf2.format(1-r.m))} (это 1 + ${N(pct(-r.m))}) = ${N(nf2.format(p*r.f))} пуль/с`);
      out.push(['Итог', tot]);
      break;}
    case 'dmgred': {
      if(A.length){const pa=plus(A); out.push([c.a.h, [pa.line+(pa.s>1?' — больше 100% не бывает':''), `Weapon-урон врага: остаётся ${N(pct(r.w))}`]]);}
      if(B.length){const pb=plus(B); out.push([c.b.h, [pb.line, `Spirit-урон врага: от оставшихся ${N(pct(r.w))} убираем ещё ${N(pct(Math.min(pb.s,1)))} → ${N(pct(r.s))}`]]);}
      break;}
  }
  el.innerHTML = `<h3>На вашей сборке</h3>` + out.map(([t,ls])=>`<div><p class="gt">${t}</p>${ls.length>1?`<ol>${ls.map(l=>`<li>${l}</li>`).join('')}</ol>`:`<p class="ln">${ls[0]}</p>`}</div>`).join('');
}

function drawChart(c){
  const cv=$('#c1'); if(!cv) return;
  const wrap=cv.parentElement, st=state[c.id];
  const w=wrap.clientWidth, h=wrap.clientHeight; if(!w||!h) return;
  const dpr=window.devicePixelRatio||1; cv.width=w*dpr; cv.height=h*dpr;
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const ink=css('--fg'), muted=css('--muted'), line=css('--line'), pat=css('--patina'), brass=css('--brass'), ash=css('--ash'), surf=css('--surface');
  const mono=css('--mono');
  const act=[0], nav=[0], mar=[0];
  for(let i=1;i<=st.sel.length;i++){const r=compute(c,st.sel.slice(0,i)); act.push(r.m*100); nav.push(r.naive*100); mar.push(Math.abs(r.m-compute(c,st.sel.slice(0,i-1)).m)*100);}
  const all=[...act,...nav,...mar];
  let lo=Math.min(0,...all), hi=Math.max(10,...all);
  const span=hi-lo, step=[5,10,20,25,50].find(s=>span/s<=6)||100;
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const F=15; // chart numbers, 40% larger than the 11px body labels
  const P={l:62,r:14,t:30,b:34}, W=w-P.l-P.r, H=h-P.t-P.b, n=act.length;
  const X=i=>P.l+(i+0.5)*W/n, Y=v=>P.t+(hi-v)/(hi-lo)*H;
  g.font=`${F}px ${mono}`; g.textBaseline='middle';
  for(let v=lo; v<=hi+1e-9; v+=step){g.strokeStyle=v===0?ash:line; g.lineWidth=1; g.beginPath(); g.moveTo(P.l,Math.round(Y(v))+.5); g.lineTo(w-P.r,Math.round(Y(v))+.5); g.stroke(); g.fillStyle=muted; g.textAlign='right'; g.fillText(String(v).replace('-','−')+'%',P.l-6,Y(v));}
  const bw=Math.min(22,W/n*0.45);
  g.fillStyle=brass;
  mar.forEach((v,i)=>{ if(!v)return; const y0=Y(0), y1=Y(v); g.beginPath(); g.roundRect?g.roundRect(X(i)-bw/2,Math.min(y0,y1),bw,Math.abs(y1-y0),[3,3,0,0]):g.rect(X(i)-bw/2,Math.min(y0,y1),bw,Math.abs(y1-y0)); g.fill(); });
  g.globalAlpha=.3; g.setLineDash([6,4]); g.strokeStyle=ash; g.lineWidth=2; g.beginPath(); nav.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))); g.stroke(); g.setLineDash([]); g.globalAlpha=1;
  g.strokeStyle=pat; g.lineWidth=2.5; g.lineJoin='round'; g.beginPath(); act.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))); g.stroke();
  act.forEach((v,i)=>{g.beginPath(); g.arc(X(i),Y(v),4.5,0,7); g.fillStyle=pat; g.fill(); g.lineWidth=2; g.strokeStyle=surf; g.stroke();});
  g.textAlign='center'; g.fillStyle=ink; g.font=`500 ${F}px ${mono}`;
  const slot=W/n, labelEvery=Math.max(1,Math.ceil(46/slot)), tickEvery=Math.max(1,Math.ceil(26/slot));
  act.forEach((v,i)=>{ if(i===0||((n-1-i)%labelEvery))return; g.fillText(nf1.format(Math.round(v*10)/10).replace('-','−'),X(i),Math.max(P.t-12,Y(v)-17)); });
  g.font=`${F}px ${mono}`; g.fillStyle=muted;
  act.forEach((v,i)=>{ if(i&&((n-1-i)%tickEvery))return; g.fillText(i===0?'—':String(i),X(i),h-P.b+19); });
  if(!st.sel.length){g.fillStyle=muted; g.font=`14px ${css('--body')}`; g.fillText('Отметьте предметы выше',P.l+W/2,P.t+H/2);}
}

function ccHTML(){return `
  <div class="pane">
    <div class="card"><div class="rule">CC within 9 s of another CC: duration −15% … −35%</div>
      <p class="about">У Crowd Control убывает не сила, а длительность. Если наложить его на цель, которую уже контролили за последние 9 секунд, он продлится меньше. Штраф начинается с 15% и растёт до 35% с числом недавних эффектов.</p></div>
    <div class="ccgrid">
      <div class="card"><b>Попадают под штраф</b><p>Stun, Sleep, Immobilize, Chain (tether) и Silence — тот же набор, что запускает Reactive Barrier.</p></div>
      <div class="card"><b>Не попадают</b><p>Movement Slow, Fire Rate Slow, Disarm, Displace, Time Stop. Slow стакается по силе — см. Movement Slow.</p></div>
      <div class="card"><b>Один каст — один CC</b><p>Если способность накладывает несколько эффектов сразу (grab + Stun у Shoulder Charge или Death Slam), они считаются за один.</p></div>
      <div class="card"><b>Защита</b><p>Unstoppable даёт иммунитет ко всему CC, Purge (например, Dispel Magic) снимает дебафы, Movement Slow Resist ослабляет только замедления.</p></div>
    </div>
    <p class="src">Значения по Deadlock Wiki на 27.10.2026: <a href="https://deadlock.wiki/Healing">Healing</a> · <a href="https://deadlock.wiki/Damage_Resistance">Damage Resistance</a> · <a href="https://deadlock.wiki/Lifesteal">Lifesteal</a> · <a href="https://deadlock.wiki/Movement_Slow">Movement Slow</a> · <a href="https://deadlock.wiki/Fire_Rate">Fire Rate</a> · <a href="https://deadlock.wiki/Ability_Cooldown">Ability Cooldown</a> · <a href="https://deadlock.wiki/Damage_Amplification">Damage Amplification</a> · <a href="https://deadlock.wiki/Crowd_Control">Crowd Control</a>. Valve часто меняет цифры в патчах.</p>
  </div>`;}

// shell wiring
const app=$('#app');
function drawer(open){app.classList.toggle('drawer',open); $('#menuBtn').setAttribute('aria-expanded',open);}
$('#menuBtn').onclick=()=>drawer(!app.classList.contains('drawer'));
$('#scrim').onclick=()=>drawer(false);
$('#navlist').addEventListener('click',e=>{ if(e.target.closest('a')) drawer(false); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') drawer(false); });
window.addEventListener('hashchange',()=>{render(); $('#body').scrollTop=0;});
let rt;
window.addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>{const c=current(); if(c.mode!=='info') drawChart(c);},120);});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);}catch(e){}
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{const c=current(); if(c.mode!=='info') drawChart(c);});
if(ICONS.Souls) document.documentElement.style.setProperty('--soul-img', `url("${ICONS.Souls}")`); // soul glyph for prices

// item card: hover with a mouse, long press on touch screens; one floating element reused for every item
const cardEl=document.createElement('div'); cardEl.id='card'; cardEl.setAttribute('role','tooltip'); document.body.appendChild(cardEl);
let cardFor=null, cardTimer, pressTimer, longPressed=false;
function showCard(el){
  const key=el.dataset.card, html=key.startsWith('ab:')?abCardHTML(key.slice(3)):cardHTML(key); // "ab:" marks hero abilities
  if(!html) return;
  cardEl.innerHTML=html; cardFor=el;
  const r=el.getBoundingClientRect(), w=cardEl.offsetWidth, h=cardEl.offsetHeight, m=12;
  let x=r.right+m, y=r.top;
  if(x+w>innerWidth-m) x=r.left-w-m;                       // no room on the right: try the left
  if(x<m){x=Math.min(Math.max(m,r.left),innerWidth-w-m); y=r.bottom+6; if(y+h>innerHeight-m) y=r.top-h-6;} // neither: below or above
  cardEl.style.left=x+'px'; cardEl.style.top=Math.max(m,Math.min(y,innerHeight-h-m))+'px';
  cardEl.classList.add('show');
}
function hideCard(){clearTimeout(cardTimer); cardFor=null; cardEl.classList.remove('show');}
const fineHover=matchMedia('(hover:hover) and (pointer:fine)');
const cols=$('#cols');
cols.addEventListener('mouseover',e=>{
  if(!fineHover.matches||drag) return;
  const el=e.target.closest('[data-card]');
  if(!el||el===cardFor) return;
  clearTimeout(cardTimer); cardTimer=setTimeout(()=>showCard(el),120);
});
cols.addEventListener('mouseout',e=>{const el=e.target.closest('[data-card]'); if(el&&!el.contains(e.relatedTarget)) hideCard();});
cols.addEventListener('touchstart',e=>{
  const el=e.target.closest('[data-card]'); if(!el||e.target.closest('.grip')) return;
  longPressed=false; clearTimeout(pressTimer);
  pressTimer=setTimeout(()=>{longPressed=true; showCard(el);},450);
},{passive:true});
['touchend','touchmove','touchcancel'].forEach(t=>cols.addEventListener(t,()=>clearTimeout(pressTimer),{passive:true}));
cols.addEventListener('contextmenu',e=>{if(longPressed&&e.target.closest('[data-card]')) e.preventDefault();});
document.addEventListener('touchstart',e=>{if(cardFor&&!e.target.closest('[data-card]')) hideCard();},{passive:true});
$('#body').addEventListener('scroll',hideCard,{passive:true});

// picked list above the chart: drag a row by its grip to change the pick order (mouse and touch)
let drag=null;
cols.addEventListener('pointerdown',e=>{
  const grip=e.target.closest('.grip'); if(!grip) return;
  e.preventDefault(); hideCard();
  const row=grip.closest('.sum-r');
  drag={row, list:row.parentElement};
  row.classList.add('dragging'); document.body.classList.add('dragging-sum');
  grip.setPointerCapture(e.pointerId);
});
cols.addEventListener('pointermove',e=>{
  if(!drag) return;
  // the row goes before the first other row whose middle is below the pointer
  const after=[...drag.list.querySelectorAll('.sum-r:not(.dragging)')].find(r=>{const b=r.getBoundingClientRect(); return e.clientY<b.top+b.height/2;});
  if(after!==drag.row.nextElementSibling) drag.list.insertBefore(drag.row, after||null);
});
function endDrag(){
  if(!drag) return;
  const order=[...drag.list.querySelectorAll('.sum-r')].map(r=>+r.dataset.pos);
  drag.row.classList.remove('dragging'); document.body.classList.remove('dragging-sum'); drag=null;
  const c=current(), st=state[c.id];
  if(order.every((p,n)=>p===n)) return; // dropped where it was
  st.sel=order.map(p=>st.sel[p]); save(c);
  const y=$('#body').scrollTop; render(); $('#body').scrollTop=y;
}
cols.addEventListener('pointerup',endDrag);
cols.addEventListener('pointercancel',endDrag);

render();
</script>
</body>
</html>
